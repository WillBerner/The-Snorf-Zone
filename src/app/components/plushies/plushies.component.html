<section class="page-heading">
  <div>
    <p class="eyebrow">Curated cozy creations</p>
    <h1>All Plushies</h1>
    <p class="summary">Browse every available plush design and click through for more photos and details.</p>
  </div>
</section>

<section class="product-grid">
  <article class="product-card" *ngFor="let product of products">
    <a [routerLink]="['/product', product.id]">
      <img [ngSrc]="product.hero" width="620" height="520" [alt]="product.title" />
    </a>
    <div class="product-copy">
      <strong>{{ product.title }}</strong>
      <p>{{ product.description }}</p>
      <div class="product-meta">
        <span>$ {{ product.price.toFixed(2) }}</span>
        <a [routerLink]="['/product', product.id]" class="product-link">Details</a>
      </div>
    </div>
  </article>
</section>
